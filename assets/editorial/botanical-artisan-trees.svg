<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" class="botanical-artisan-svg">
  <!-- Soft ground mound -->
  <path d="M-20 400 Q80 340 220 375 Q320 400 520 380 L520 420 L-20 420 Z" fill="#E6DAC8" opacity="0.4" />
  <path d="M-10 400 Q100 360 260 385 Q360 405 500 395" stroke="#FFCC00" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6" />

  <!-- Main Left Artisanal Tree (Coral / Terracotta with Hand-Drawn Block Texture) -->
  <g class="tree-coral">
    <!-- Base & Trunk -->
    <path d="M-10 410 C15 390 35 340 38 290 C40 240 35 190 20 150 C45 170 65 200 68 240 C75 190 85 140 115 110 C100 135 95 160 90 200 C110 160 145 130 185 125 C155 145 130 175 120 220 C140 200 170 190 205 195 C175 210 150 230 140 260 C155 245 180 240 215 250 C175 270 150 300 145 350 C140 385 135 410 135 410 Z" 
          fill="#D97A53" opacity="0.95" />

    <!-- Trunk Wood-Block Texture Lines -->
    <path d="M10 395 C25 350 30 300 28 250" stroke="#FFCC00" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.8" />
    <path d="M28 390 C42 340 48 290 46 240" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 5" opacity="0.7" />
    <path d="M48 395 C60 345 65 300 65 260" stroke="#FFB900" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.8" />
    <path d="M70 400 C85 360 92 320 95 280" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 5" opacity="0.7" />
    <path d="M92 405 C108 370 118 335 122 300" stroke="#FFCC00" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.8" />

    <!-- Branch Pods & Foliage Sprigs (Teak Block Stylized) -->
    <!-- Pod 1 top left -->
    <g transform="translate(18, 140)">
      <ellipse cx="0" cy="0" rx="8" ry="16" fill="#F4E8D8" transform="rotate(-30)" />
      <ellipse cx="14" cy="-8" rx="7" ry="14" fill="#C86A45" transform="rotate(20)" />
      <circle cx="8" cy="-14" r="3" fill="#FFCC00" />
    </g>

    <!-- Pod 2 center top -->
    <g transform="translate(112, 105)">
      <ellipse cx="-6" cy="0" rx="7" ry="15" fill="#F4E8D8" transform="rotate(-25)" />
      <ellipse cx="8" cy="-4" rx="8" ry="16" fill="#C86A45" transform="rotate(35)" />
      <ellipse cx="2" cy="-15" rx="6" ry="12" fill="#FFB900" transform="rotate(5)" />
    </g>

    <!-- Pod 3 right branch -->
    <g transform="translate(185, 122)">
      <ellipse cx="-8" cy="4" rx="7" ry="14" fill="#C86A45" transform="rotate(-40)" />
      <ellipse cx="6" cy="-2" rx="8" ry="15" fill="#F4E8D8" transform="rotate(30)" />
      <ellipse cx="0" cy="-12" rx="6" ry="12" fill="#FF5F00" transform="rotate(10)" />
    </g>

    <!-- Mid branches foliage clusters -->
    <g transform="translate(85, 230)">
      <path d="M0 0 C15 -10 35 -10 50 0 C40 15 20 20 0 0 Z" fill="#B85D38" />
      <circle cx="15" cy="-2" r="3" fill="#FFFFFF" />
      <circle cx="28" cy="-2" r="3" fill="#FFCC00" />
      <circle cx="40" cy="2" r="2.5" fill="#FFFFFF" />
      <path d="M10 8 Q25 2 42 12" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2 3" />
    </g>

    <g transform="translate(135, 255)">
      <path d="M0 0 C20 -15 45 -10 60 5 C45 20 25 20 0 0 Z" fill="#B85D38" />
      <circle cx="18" cy="-2" r="3" fill="#FFB900" />
      <circle cx="34" cy="-2" r="3" fill="#FFFFFF" />
      <circle cx="48" cy="4" r="2.5" fill="#FFCC00" />
    </g>

    <g transform="translate(85, 305)">
      <path d="M0 0 C25 -15 50 -10 70 8 C50 22 25 22 0 0 Z" fill="#B85D38" />
      <circle cx="20" cy="-2" r="3.5" fill="#FFFFFF" />
      <circle cx="38" cy="-2" r="3.5" fill="#FFCC00" />
      <circle cx="55" cy="5" r="3" fill="#FFFFFF" />
      <path d="M15 10 Q35 2 58 14" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2 3" />
    </g>
  </g>

  <!-- Secondary Slate / Indigo Botanical Tree (Center) -->
  <g class="tree-slate" transform="translate(130, 20)">
    <!-- Slender Trunk -->
    <path d="M185 365 C185 320 180 270 170 230 C165 205 155 185 145 165 C158 175 170 190 178 210 C182 175 192 145 210 125 C202 150 198 175 195 200 C210 170 230 145 255 130 C240 155 228 180 220 215 C235 195 258 180 285 175 C265 195 250 220 240 250 C242 290 245 330 248 375 Z" 
          fill="#A3B4C8" opacity="0.85" />

    <!-- Foliage Dotted Clouds (White & Pale Gold) -->
    <!-- Cloud Left -->
    <g transform="translate(135, 145)">
      <circle cx="-12" cy="0" r="14" fill="#FFFFFF" opacity="0.95" />
      <circle cx="4" cy="-10" r="15" fill="#FFF8EE" opacity="0.95" />
      <circle cx="16" cy="6" r="13" fill="#FFD980" opacity="0.9" />
      <circle cx="0" cy="10" r="12" fill="#FFFFFF" opacity="0.95" />
      <!-- Dot details inside -->
      <circle cx="-12" cy="0" r="2" fill="#103A60" />
      <circle cx="4" cy="-10" r="2" fill="#103A60" />
      <circle cx="16" cy="6" r="2" fill="#103A60" />
    </g>

    <!-- Cloud Center -->
    <g transform="translate(205, 110)">
      <circle cx="-14" cy="2" r="15" fill="#FFFFFF" opacity="0.95" />
      <circle cx="0" cy="-12" r="18" fill="#FFF8EE" opacity="0.95" />
      <circle cx="18" cy="-2" r="16" fill="#FFD980" opacity="0.9" />
      <circle cx="6" cy="14" r="14" fill="#FFFFFF" opacity="0.95" />
      <circle cx="-8" cy="12" r="12" fill="#F0E4D4" opacity="0.95" />
      <!-- Dotted texture -->
      <circle cx="0" cy="-12" r="2.2" fill="#103A60" />
      <circle cx="18" cy="-2" r="2.2" fill="#103A60" />
      <circle cx="-14" cy="2" r="2.2" fill="#103A60" />
    </g>

    <!-- Cloud Right -->
    <g transform="translate(265, 145)">
      <circle cx="-10" cy="-6" r="14" fill="#FFF8EE" opacity="0.95" />
      <circle cx="10" cy="-10" r="15" fill="#FFFFFF" opacity="0.95" />
      <circle cx="20" cy="6" r="13" fill="#FFD980" opacity="0.9" />
      <circle cx="2" cy="10" r="12" fill="#FFFFFF" opacity="0.95" />
      <circle cx="10" cy="-10" r="2" fill="#103A60" />
      <circle cx="20" cy="6" r="2" fill="#103A60" />
    </g>
  </g>

  <!-- Delicate Floral Sprig on Far Right -->
  <g class="botanical-sprig" transform="translate(420, 240)">
    <path d="M0 150 C-10 100 -5 50 15 0" stroke="#7E9BB8" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Leaf pairs -->
    <path d="M-6 120 C-18 115 -25 105 -22 95 C-12 95 -4 105 -6 120 Z" fill="#D97A53" opacity="0.85" />
    <path d="M-2 100 C12 95 18 85 15 75 C5 75 -1 85 -2 100 Z" fill="#FFCC00" opacity="0.9" />
    <path d="M1 75 C-12 70 -18 60 -15 50 C-5 50 1 60 1 75 Z" fill="#E6DAC8" opacity="0.9" />
    <path d="M6 55 C18 50 24 40 21 30 C11 30 5 40 6 55 Z" fill="#D97A53" opacity="0.85" />
    <path d="M10 30 C2 25 -2 15 1 5 C10 5 15 15 10 30 Z" fill="#FFB900" opacity="0.9" />
    <path d="M15 0 C25 -5 32 -15 28 -25 C18 -25 12 -15 15 0 Z" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Golden Dragonfly / Moth hovering peacefully -->
  <g class="dragonfly" transform="translate(385, 230) rotate(-15)">
    <!-- Slender Body -->
    <path d="M0 0 L2 18" stroke="#FFCC00" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0.5" cy="-1" r="2" fill="#FF5F00" />
    <!-- Upper Wings -->
    <ellipse cx="-7" cy="4" rx="8" ry="2.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-25 -7 4)" />
    <ellipse cx="8" cy="2" rx="8" ry="2.5" fill="#FFFFFF" opacity="0.85" transform="rotate(20 8 2)" />
    <!-- Lower Wings -->
    <ellipse cx="-6" cy="8" rx="6" ry="2" fill="#FFCC00" opacity="0.75" transform="rotate(-15 -6 8)" />
    <ellipse cx="7" cy="7" rx="6" ry="2" fill="#FFCC00" opacity="0.75" transform="rotate(15 7 7)" />
  </g>
</svg>
